<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f9dce8"><meta name="description" content="Nežna roza galerija fotografij.">
<title>Pink Memories ♡ | Moja galerija</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--pink:#e87ca5;--dark:#653c50;--muted:#9b7586;--paper:#fffafc;--border:#f5dbe5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--dark);font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 10% 0%,#ffe5f0,transparent 35%),radial-gradient(circle at 95% 25%,#f9d9e9,transparent 30%),#fff8fb}button{font:inherit}header{text-align:center;padding:75px 20px 55px}.eyebrow{letter-spacing:4px;text-transform:uppercase;font-size:11px;font-weight:700;color:#c8799b}.heart{display:inline-block;color:#e782aa;font-size:25px;animation:pulse 2.5s infinite}h1{font-family:'Playfair Display',serif;font-size:clamp(48px,8vw,88px);font-weight:500;letter-spacing:-3px;margin:12px 0}h1 em{color:#e782aa;font-weight:500}header p{font-size:15px;color:var(--muted);max-width:430px;margin:15px auto;line-height:1.8}.divider{width:80px;height:1px;background:#e9a7c1;margin:27px auto}.wrap{max-width:1220px;padding:0 28px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}.bar h2{font-family:'Playfair Display',serif;font-size:25px;font-weight:500;margin:0}.count{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--border);padding:10px 16px;border-radius:30px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.photo{border:1px solid #f7e4eb;background:white;border-radius:19px;padding:9px;box-shadow:0 10px 35px #a65d8012;cursor:pointer;text-align:left;transition:transform .3s,box-shadow .3s;min-width:0}.photo:hover{transform:translateY(-7px);box-shadow:0 18px 35px #a65d802b}.image-wrap{position:relative;overflow:hidden;border-radius:12px;aspect-ratio:3/4;background:#f9dbe7}.image-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.photo:hover img{transform:scale(1.07)}.overlay{position:absolute;inset:0;background:linear-gradient(transparent 60%,#4d203b70);opacity:0;transition:opacity .3s;display:flex;align-items:flex-end;justify-content:flex-end;padding:15px;color:white;font-size:22px}.photo:hover .overlay{opacity:1}.info{padding:13px 5px 7px}.info strong{display:block;font-size:13px;font-weight:600}.info span{display:block;color:#b48b9b;font-size:11px;margin-top:5px}footer{text-align:center;color:#b98ba0;padding:70px 20px 35px;font-size:12px}footer .symbol{font-size:22px;color:#e58cad;display:block;margin-bottom:10px}.lightbox{position:fixed;inset:0;z-index:10;background:#321d2be8;display:none;align-items:center;justify-content:center;padding:60px 65px;backdrop-filter:blur(12px)}.lightbox.open{display:flex}.lightbox figure{margin:0;max-width:min(85vw,850px);text-align:center}.lightbox img{display:block;max-width:100%;max-height:73vh;object-fit:contain;border-radius:13px;margin:auto;box-shadow:0 25px 80px #0005}.lightbox figcaption{color:#fff;margin-top:18px;font-family:'Playfair Display',serif;font-size:21px}.control{position:absolute;border:1px solid #ffffff55;color:#fff;background:#ffffff20;border-radius:50%;height:43px;width:43px;cursor:pointer;font-size:25px;display:grid;place-items:center}.control:hover{background:#ffffff44}.close{right:25px;top:23px}.prev{left:18px;top:50%}.next{right:18px;top:50%}body.lock{overflow:hidden}@keyframes pulse{50%{transform:scale(1.2)}}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){header{padding:55px 18px 35px}.wrap{padding:0 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.photo{padding:6px;border-radius:13px}.image-wrap{border-radius:9px}.info{padding:10px 4px 6px}.info strong{font-size:12px}.lightbox{padding:65px 45px}.control{width:34px;height:34px}.prev{left:5px}.next{right:5px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="eyebrow">✦ a little collection of beautiful moments ✦</div><h1>Pink <em>Memories</em> <span class="heart">♡</span></h1><div class="divider"></div><p>Majhni trenutki, veliki spomini. Dobrodošla v moji mali galeriji, kjer ima vsaka fotografija svojo zgodbo.</p></header>
<main class="wrap"><div class="bar"><h2>Moji trenutki <span style="color:#e8a1bd">✿</span></h2><span class="count">12 fotografij ♡</span></div><section class="grid" id="gallery" aria-label="Galerija fotografij"></section></main>
<footer><span class="symbol">♡ ✿ ♡</span>Made with love & a little pink magic · 2026</footer>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Povečana fotografija"><button class="control close" id="close" aria-label="Zapri">×</button><button class="control prev" id="prev" aria-label="Prejšnja fotografija">‹</button><figure><img id="large" alt=""><figcaption id="caption"></figcaption></figure><button class="control next" id="next" aria-label="Naslednja fotografija">›</button></div>
<script>
// Zamenjaj URL-je v polju photos s svojimi slikami, npr. "images/slika1.jpg".
const photos=[
 {title:'Soft mornings',note:'01 · little things',url:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=900&auto=format&fit=crop&q=85'},
 {title:'Sweet details',note:'02 · little things',url:'https://images.unsplash.com/photo-1483985988355-763728e1935b?w=900&auto=format&fit=crop&q=85'},
 {title:'Blooming days',note:'03 · little things',url:'https://images.unsplash.com/photo-1457089328109-e5d9bd499191?w=900&auto=format&fit=crop&q=85'},
 {title:'Coffee & dreams',note:'04 · little things',url:'https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=900&auto=format&fit=crop&q=85'},
 {title:'Golden hour',note:'05 · little things',url:'https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900&auto=format&fit=crop&q=85'},
 {title:'Pretty in pink',note:'06 · little things',url:'https://images.unsplash.com/photo-1525310072745-f49212b5ac6d?w=900&auto=format&fit=crop&q=85'},
 {title:'Summer glow',note:'07 · little things',url:'https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900&auto=format&fit=crop&q=85'},
 {title:'Little escapes',note:'08 · little things',url:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900&auto=format&fit=crop&q=85'},
 {title:'Flower mood',note:'09 · little things',url:'https://images.unsplash.com/photo-1468327768560-75b778cbb551?w=900&auto=format&fit=crop&q=85'},
 {title:'Lovely places',note:'10 · little things',url:'https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=900&auto=format&fit=crop&q=85'},
 {title:'Sweet moments',note:'11 · little things',url:'https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?w=900&auto=format&fit=crop&q=85'},
 {title:'Forever memories',note:'12 · little things',url:'https://images.unsplash.com/photo-1499002238440-d264edd596ec?w=900&auto=format&fit=crop&q=85'}
];
const gallery=document.getElementById('gallery'),box=document.getElementById('lightbox'),large=document.getElementById('large'),caption=document.getElementById('caption');let active=0,lastFocus=null;
photos.forEach((p,i)=>{const b=document.createElement('button');b.className='photo';b.setAttribute('aria-label','Odpri fotografijo '+(i+1)+': '+p.title);const w=document.createElement('div');w.className='image-wrap';const img=document.createElement('img');img.src=p.url;img.alt=p.title;img.loading=i<4?'eager':'lazy';img.onerror=()=>{img.alt='Fotografija ni na voljo'};const o=document.createElement('div');o.className='overlay';o.textContent='↗';w.append(img,o);const info=document.createElement('div');info.className='info';const strong=document.createElement('strong');strong.textContent=p.title;const note=document.createElement('span');note.textContent=p.note;info.append(strong,note);b.append(w,info);b.addEventListener('click',()=>open(i));gallery.append(b)});
function show(i){active=(i+photos.length)%photos.length;large.src=photos[active].url;large.alt=photos[active].title;caption.textContent=photos[active].title+' ♡'}function open(i){lastFocus=document.activeElement;show(i);box.classList.add('open');document.body.classList.add('lock');document.getElementById('close').focus()}function close(){box.classList.remove('open');document.body.classList.remove('lock');if(lastFocus)lastFocus.focus()}
document.getElementById('close').onclick=close;document.getElementById('prev').onclick=()=>show(active-1);document.getElementById('next').onclick=()=>show(active+1);box.addEventListener('click',e=>{if(e.target===box)close()});document.addEventListener('keydown',e=>{if(!box.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(active-1);if(e.key==='ArrowRight')show(active+1);if(e.key==='Tab'){const controls=[document.getElementById('close'),document.getElementById('prev'),document.getElementById('next')];let idx=controls.indexOf(document.activeElement);e.preventDefault();controls[(idx+(e.shiftKey?-1:1)+controls.length)%controls.length].focus()}});
</script>
</body></html>
