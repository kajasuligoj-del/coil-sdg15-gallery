<!doctype html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#140b13" />
  <meta name="description" content="Moderna fotografska galerija v roza odtenkih." />
  <title>NOIR — Galerija</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="logo" href="#vrh">NOIR<span>.</span></a><a class="header-link" href="#galerija">Razišči galerijo <span aria-hidden="true">↗</span></a></header>
  <main id="vrh">
    <section class="hero"><div class="eyebrow"><span class="dot"></span> USTVARJALNA ZBIRKA</div><h1>Trenutki, ujeti<br><em>v svetlobi.</em></h1><p>Prostor za zgodbe, barve in podrobnosti. Tvoja osebna galerija fotografij.</p><a class="cta" href="#galerija">Oglej si fotografije <span aria-hidden="true">↓</span></a><div class="hero-decoration" aria-hidden="true">N° 01 / 2026</div></section>
    <section class="gallery-section" id="galerija" aria-labelledby="gallery-title"><div class="section-top"><div><div class="eyebrow">IZBRANA DELA</div><h2 id="gallery-title">Galerija <span id="photo-count">06</span></h2></div><div class="filters" role="group" aria-label="Filtriraj fotografije"><button class="filter active" data-filter="vse" aria-pressed="true">Vse</button><button class="filter" data-filter="narava" aria-pressed="false">Narava</button><button class="filter" data-filter="mesto" aria-pressed="false">Mesto</button><button class="filter" data-filter="detajli" aria-pressed="false">Mesto</button><button class="filter" data-filter="detajli" aria-pressed="false">Mesto</button><button class="filter" data-filter="detajli" aria-pressed="false">Mesto</button><button class="filter" data-filter="detajli" aria-pressed="false">Detajli</button></div></div><div class="gallery-grid" id="gallery-grid"></div></section>
  </main>
  <footer><span>© <span id="year"></span> NOIR GALERIJA</span><span>Ustvarjeno z ♥</span></footer>
  <dialog id="lightbox" aria-label="Povečana fotografija"><button id="close-lightbox" class="close-lightbox" aria-label="Zapri fotografijo">×</button><img id="lightbox-image" alt="" /><p id="lightbox-caption"></p></dialog>
</body>
</html>
